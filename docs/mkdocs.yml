site_name: KLASK Hardware
site_url: https://idscethzurich.github.io/klask_hardware/
docs_dir: .
site_dir: ../site

theme:
  name: material
  icon:
    logo: material/hockey-puck
  features:
    - navigation.instant
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue

nav:
  - Home: index.md
  - Tutorials:
      - Overview: tutorials/00-overview.md
      - Hardware Assembly Guide: tutorials/01-hardware-assembly.md
      - Runtime Startup: tutorials/02-runtime-startup.md
      - Development Setup: tutorials/03-dev-setup.md
  - Contribution:
      - Contributing: contribution/contributing.md
      - Code Style: contribution/code_guideline.md
  - Reference:
      - API (Doxygen): reference/api.md

not_in_nav: |
  /reference/mainpage.md

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.superfences
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
