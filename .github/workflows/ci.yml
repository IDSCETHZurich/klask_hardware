name: ci

on:
  push:
    branches: ["**"] # every commit
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/idscethzurich/klask_hardware/ci:latest
    defaults:
      run:
        shell: bash
        working-directory: ros
    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        run: |
          . /opt/ros/${ROS_DISTRO}/setup.sh
          colcon build

      - name: Run tests
        run: |
          . /opt/ros/${ROS_DISTRO}/setup.sh
          . install/setup.sh
          colcon test

      - name: Test results
        if: always()
        run: |
          . /opt/ros/${ROS_DISTRO}/setup.sh
          . install/setup.sh
          colcon test-result --verbose
