name: ci

on:
  push:
    branches: ["**"] # every commit
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/idscethzurich/klask_hardware/ci:latest
    defaults:
      run:
        shell: bash
        working-directory: ros
    steps:
      - uses: actions/checkout@v4

      - name: Copy third-party packages to workspace
        run: cp -r /opt/ros/klask_ws/third_party .

      - name: Build packages
        run: |
          . /opt/ros/${ROS_DISTRO}/setup.sh
          colcon build

      - name: Run tests
        run: |
          . /opt/ros/${ROS_DISTRO}/setup.sh
          . install/setup.sh
          colcon test --packages-select klask_imaging_pkg klask_interfaces klask_motor_commander_pkg # only test our packages

      - name: Test results
        if: always()
        run: |
          . /opt/ros/${ROS_DISTRO}/setup.sh
          . install/setup.sh
          colcon test-result --verbose
