# ODriveController Parameters Configuration
# This file contains all configurable parameters for the ODriveController class
# which manages both player motor controllers and coordinates velocity commands.

/**:
  ros__parameters:
    # === Topic Names ===
    cmd_vel_right_player: "/cmd_vel/right_player" # Velocity command topic for right player
    cmd_vel_left_player: "/cmd_vel/left_player" # Velocity command topic for left player

    # === Service Names ===
    calibrate_encoders_service: "calibrate_encoders" # Service for encoder calibration
    get_calibration_status_service: "get_calibration_status" # Service for querying calibration status
    is_player_homed_service: "is_player_homed" # Service for checking if player is at home position
    set_motor_state_service: "set_motor_state" # Service for motor state changes

    # === Action Names ===
    right_player_action_name: "home_peg_right_player" # Action for right player peg homing
    left_player_action_name: "home_peg_left_player" # Action for left player peg homing
    right_player_home_calibrate_action: "home_and_calibrate_right_player" # Action for right player home and calibrate
    left_player_home_calibrate_action: "home_and_calibrate_left_player" # Action for left player home and calibrate

    # === Home Position Parameters ===
    # Default home positions for each player's field area (meters)
    right_player_home_x: 0.26 # Right player default home X position
    right_player_home_y: 0.16 # Right player default home Y position
    left_player_home_x: 0.16 # Left player default home X position
    left_player_home_y: 0.16 # Left player default home Y position
    position_tolerance: 0.01 # Goal position tolerance for homing check (meters)
    homing_velocity: 0.03 # Velocity for homing movement (m/s)

    # === QoS Settings ===
    cmd_vel_qos_depth: 1 # QoS history depth for velocity command subscriptions

    # === Initial Motor State ===
    # Note: This parameter tracks the expected motor state but does not initialize motors at startup.
    # Motors are initialized to CLOSED_LOOP_CONTROL in klask_motor_commander after executor starts.
    initial_motor_state: 8 # Expected motor state (8 = closed loop control)
