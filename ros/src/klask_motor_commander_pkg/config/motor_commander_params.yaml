# Motor Commander Main Entry Point Parameters
# This file contains configuration for the main motor commander executable
# which coordinates the homing sequence and system initialization.

/**:
  ros__parameters:
    # === Homing Sequence Configuration ===
    enable_right_player_homing: false  # Enable automatic homing for right player on startup
    enable_left_player_homing: true   # Enable automatic homing for left player on startup
    
    # === Action Client Configuration ===
    right_player_action_name: "home_peg_right_player"  # Action server name for right player homing
    left_player_action_name: "home_peg_left_player"    # Action server name for left player homing
    
    # === Timeout Settings (seconds) ===
    action_server_wait_timeout: 5     # Timeout waiting for action server availability
    homing_action_timeout: 30         # Timeout for homing action to complete
    calibration_service_timeout: 5    # Timeout for calibration service call
    
    # === Timing Configuration (milliseconds) ===
    startup_delay: 1000               # Initial delay after executor starts
    inter_homing_delay: 500           # Delay between consecutive homing operations
    
    # === Service Names ===
    calibrate_encoders_service: "calibrate_encoders"  # Calibration service name
