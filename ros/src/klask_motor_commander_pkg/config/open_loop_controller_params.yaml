# OpenLoopController Parameters Configuration
# This file contains all configurable parameters for the OpenLoopController class
# which handles peg homing operations using velocity control.

/**:
  ros__parameters:
    # === Movement Validation Parameters ===
    movement_validation_duration: 2.0 # Time to wait before checking peg movement (seconds)
    movement_threshold: 0.01 # Minimum distance peg must move to be considered moving (meters)

    # === Control Loop Parameters ===
    control_frequency: 10.0 # Control loop frequency (Hz)

    # === Topic Names ===
    board_state_topic: "/board_state" # Topic for board state updates (in EU: meters, m/s)

    # === QoS Settings ===
    board_state_qos_depth: 10 # QoS history depth for board state subscription

    # === Timeout Settings ===
    initial_state_timeout: 5.0 # Timeout waiting for initial board state (seconds)
