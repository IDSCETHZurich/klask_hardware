# Sprite processing configuration
# Used by scripts/process_sprites.py to extract sprite assets from captured board images.

paths:
  data_dir: "../data/input" # relative to this config file, or absolute
  output_dir: "../data/output"

board:
  width_m: 0.42
  height_m: 0.32

segmentation:
  rough_crop_radius_px: 50

  ball:
    h_range: [15, 40] # yellow hue in OpenCV HSV (0-179)
    s_min: 40 # minimum saturation
    v_min: 120 # minimum value/brightness

  peg:
    v_max: 40 # pegs are dark (low V channel)
    bg_diff_threshold: 15 # grayscale diff threshold for background subtraction

  morphology:
    kernel_size: 3 # elliptical structuring element diameter
    open_iterations: 1 # noise removal
    close_iterations: 2 # gap filling

  component:
    min_area_px: 30
    max_area_px: 800

  sprite_padding_px: 3
  alpha_blur_sigma: 0.5 # 0 = hard mask, >0 = anti-aliased (e.g. 0.5)

process:
  peg: true # process left and right peg grid samples
  ball: false # process ball samples
  background: true # save the median background image

debug:
  mode: "show" # "off", "save" (to disk), or "show" (OpenCV window, press key to advance, 'q' to quit)
