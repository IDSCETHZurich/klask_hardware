/velocity_profile_node:
  ros__parameters:
    # ============================================
    # General Configuration
    # ============================================

    player: "left_player" # "both", "left_player", or "right_player"
    runs_per_pattern: 10 # Number of rosbag runs per pattern
    validation_runs_per_pattern: 2 # Extra runs per pattern for validation set
    run_duration: 15.0 # Duration of each run (seconds)
    control_rate: 50.0 # State machine tick rate (Hz)

    # ============================================
    # Pattern Configuration
    # ============================================
    # Each pattern has a name, type, and 4 parameter values.
    #   line:   [min_x, min_y, max_x, max_y]
    #   circle: [center_x, center_y, radius, 0.0]
    # pattern_params is a flat array: 4 values per pattern, concatenated.

    pattern_names: [ "x_line", "y_line", "diag_line_tl_br", "diag_line_bl_tr", "small_circle" ]
    pattern_types: [ "line", "line", "line", "line", "circle" ]
    pattern_params:
      [
        0.10,
        0.16,
        0.14,
        0.16, # x_line:       horizontal sweep at y=0.16
        0.11,
        0.07,
        0.11,
        0.25, # y_line:       vertical sweep at x=0.11
        0.04,
        0.07,
        0.12,
        0.25, # diag_line:    diagonal sweep corner-to-corner
        0.14,
        0.07,
        0.02,
        0.25, # diag_line:    diagonal sweep corner-to-corner
        0.11,
        0.16,
        0.03,
        0.0,
      ] # small_circle: r=0.03 around (0.11, 0.16)

    # ============================================
    # Topic Configuration
    # ============================================

    cmd_vel_right_topic: "/cmd_vel/right_player"
    cmd_vel_left_topic: "/cmd_vel/left_player"
    board_state_topic: "/board_state"

    # ============================================
    # Velocity Configuration
    # ============================================

    v_min: 0.05 # Min velocity magnitude (m/s).
    v_max: 0.5 # Max velocity magnitude (m/s). Also sets the motor_commander max_velocity clamp.
    velocity_mode: "linear" # "random" = uniform sample, "linear" = evenly spaced steps from v_min to v_max

    # ============================================
    # Motion Configuration
    # ============================================

    settle_time: 1.0 # Pause between actions (seconds)
    move_to_home_velocity: 0.05 # Speed for returning to home position (m/s)
    position_tolerance: 0.01 # Tolerance for endpoint/home position checks (meters)
    circle_correction_gain: 60.0 # Proportional gain for radial correction on circle patterns

    # ============================================
    # Home Positions (meters)
    # ============================================

    right_player_home_x: 0.31
    right_player_home_y: 0.16
    left_player_home_x: 0.11
    left_player_home_y: 0.16

    # ============================================
    # Homing Configuration
    # ============================================

    homing_poll_interval: 1.0 # Seconds between homing status checks
    homing_timeout: 60.0 # Max seconds to wait for homing

    # ============================================
    # Recording Configuration
    # ============================================

    bag_output_dir: "vel_profile_bags" # Output directory for rosbag files. Bags are written to <bag_output_dir>/train/ and <bag_output_dir>/validation/ subfolders.
