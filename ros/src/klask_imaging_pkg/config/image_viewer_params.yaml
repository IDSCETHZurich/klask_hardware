image_viewer:
  ros__parameters:
    board_image_topic: board_image/compressed # Topic to subscribe for board images (default: board_image/compressed)
    board_state_topic: board_state # Topic to subscribe for estimated state (default: board_state)

    # Toggle overlay of estimated state on the image
    show_state_overlay: true

    # Toggle overlay of cmd_vel command vectors on the image
    show_cmd_vel_overlay: false
    cmd_vel_left_player_topic: /cmd_vel/left_player
    cmd_vel_right_player_topic: /cmd_vel/right_player

    # ============================================
    # EU to Pixel Conversion Parameters
    # ============================================
    # State is received in engineering units (meters, m/s) and must be
    # converted back to pixels for overlay visualization.
    # Board pixel dimensions are determined automatically from the received image.
    
    # Board physical dimensions in meters (must match state_estimator)
    board_width_meters: 0.42   # Physical board width (default: 0.42m)
    board_height_meters: 0.32  # Physical board height (default: 0.32m)
    # Conversion factors are computed automatically from actual image dimensions:
    # meter_to_pixel_x = image_width / board_width_meters
    # meter_to_pixel_y = image_height / board_height_meters

    # Goal overlay
    goal_radius: 22
    overlay_goal_color: [140, 255, 0] # BGR
    overlay_goal_center_radius: 5
    overlay_goal_circle_thickness: 2

    # Object overlay
    overlay_dot_radius: 5
    overlay_arrow_thickness: 2
    overlay_arrow_tip_length: 0.3

    # Left peg (BGR)
    overlay_left_peg_dot_color: [255, 0, 0]
    overlay_left_peg_arrow_color: [248, 193, 110]
    overlay_left_peg_velocity_scale: 0.5

    # Right peg (BGR)
    overlay_right_peg_dot_color: [0, 100, 0]
    overlay_right_peg_arrow_color: [144, 238, 144]
    overlay_right_peg_velocity_scale: 0.5

    # Ball (BGR)
    overlay_ball_dot_color: [0, 0, 255]
    overlay_ball_arrow_color: [0, 165, 255]
    overlay_ball_velocity_scale: 0.2

    # Cmd_vel overlay (BGR)
    overlay_cmd_vel_left_arrow_color: [255, 100, 255]  # Magenta for left player
    overlay_cmd_vel_left_velocity_scale: 0.5
    overlay_cmd_vel_right_arrow_color: [255, 255, 100]  # Cyan for right player
    overlay_cmd_vel_right_velocity_scale: 0.5
    overlay_cmd_vel_arrow_thickness: 3
    overlay_cmd_vel_arrow_tip_length: 0.2
